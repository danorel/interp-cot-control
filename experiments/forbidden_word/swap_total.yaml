# Prompt swap: re-read each CoT under every condition's prompt (see swap.py docstring).
# Needs a finished generation run; the model must match the one that generated it.
#   pod:   uv run interp-run experiments/forbidden_word/swap_total.yaml   (~10-15 min on A100)
#   smoke: ... model=configs/models/qwen3-0.6b.yaml params.n_problems=1
name: forbidden_word_total_swap
target: experiments.forbidden_word.swap:PromptSwapExperiment
seed: 0
model: configs/models/qwen3-8b.yaml   # thinking flag is irrelevant: prompts come pre-formatted
params:
  generations: outputs/forbidden_word_total/20261007-112023/generations.jsonl
  n_problems: null
  target:
    word: total
    forms: [total, totals, totaled, totaling, totalled, totalling]
  other:
    word: sum
    forms: [sum, sums, summed, summing]
  cot_conditions: [control, forbid, random, grader]
  prompt_conditions: [control, forbid, random, grader]
  # Words written instead of "total" (single-token variants only; generic words like
  # "all"/"whole" left out). Positions before them form the "substitute" class.
  substitutes: [sum, overall, combined, altogether, aggregate]
  max_class_positions: 64
  n_bins: 5
  lens:
    layers: null
    max_positions: 128
    topk: 10
