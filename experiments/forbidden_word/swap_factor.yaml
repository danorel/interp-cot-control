# Prompt swap for experiment 2 ("factor" on MATH); see swap.yaml and swap.py.
#   uv run interp-run experiments/forbidden_word/swap_factor.yaml \
#       params.generations=outputs/forbidden_word_factor/<stamp>/generations.jsonl
name: forbidden_word_factor_swap
target: experiments.forbidden_word.swap:PromptSwapExperiment
seed: 0
model: configs/models/qwen3-8b.yaml   # same model as the generation run; prompts come pre-formatted
params:
  generations: SET-ON-COMMAND-LINE/generations.jsonl   # params.generations=... (see above)
  n_problems: null
  target:
    word: factor
    forms: [factor, factors, factored, factoring, factorization, factorizations, factorize, factorized, factorizes, factorizing]
  other:
    word: divisor
    forms: [divisor, divisors]
  cot_conditions: [control, forbid, random, grader]
  prompt_conditions: [control, forbid, random, grader]
  # Words the model may write instead of "factor" (single-token variants only).
  substitutes: [divisor, product, multiple]
  max_class_positions: 64
  n_bins: 5
  lens:
    layers: null
    max_positions: 128
    topk: 10
    single_token_words: true
